name: Render resource gate

# Resource evidence must run for drafts too; it is not the full application CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'assets/render/**'
      - 'docs/render-materials/**'
      - 'crates/render/**'
      - 'crates/geom/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'ATTRIBUTION.md'
      - '.github/workflows/render-resources.yml'
  push:
    branches: [main, lab/render-materials]
    paths:
      - 'assets/render/**'
      - 'docs/render-materials/**'
      - 'crates/render/**'
      - 'crates/geom/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'ATTRIBUTION.md'
      - '.github/workflows/render-resources.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-resources-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    name: Resources / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as repository CI
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Install offline authoring dependencies
        run: python -m pip install --disable-pip-version-check -r assets/render/starter/tools/requirements.txt
      - name: Validate authored resources against native Rust APIs
        run: python -B assets/render/starter/tools/check_all.py
      - name: Retain gate evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, same pin as repository CI
        with:
          name: render-resources-${{ matrix.os }}
          path: target/render-starter-checks/
          if-no-files-found: warn
          retention-days: 7
