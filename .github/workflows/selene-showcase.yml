name: SELENE showcase package

# Artifact-only delivery of the reviewed committed image, not renderer or CI evidence.
# No application compilation, GPU probing, dependency installation or model changes.
on:
  push:
    branches: [lab/render-scale-resources]
    paths:
      - '.github/workflows/selene-showcase.yml'
      - 'assets/render/selene/exports/SELENE-studio-4k.png'
      - 'assets/render/selene/scenes/studio-hero.json'
      - 'tools/render-library/package_selene.py'
      - 'tools/render-library/publish_selene.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selene-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == '0xlillith/solidcraft'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, existing repository pin
        with:
          persist-credentials: false
      - name: Verify and package the exact completed native showcase
        run: python3 -B tools/render-library/package_selene.py --out target/selene-showcase-package
      - name: Confirm tracked resources are unchanged
        run: git diff --exit-code
      - name: Retain PNG, manifest, provenance and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, existing repository pin
        with:
          name: SELENE-studio-4k-${{ github.sha }}
          path: target/selene-showcase-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
